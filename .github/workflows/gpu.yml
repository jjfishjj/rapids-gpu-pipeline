name: RAPIDS GPU pipeline
on: {workflow_dispatch: {}}
jobs:
  benchmark:
    runs-on: [self-hosted, linux, x64, gpu]
    steps:
      - uses: actions/checkout@v4
      - run: nvidia-smi
      - run: python src/pipeline.py --rows 10000000 --backend gpu | tee rapids-result.json
      - uses: actions/upload-artifact@v4
        with: {name: rapids-result, path: rapids-result.json}
